apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: turnip-server
rules:
  # internal/jobs/client.go: Create/Delete Runner Jobs.
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "delete", "get", "list", "watch"]
  # internal/jobs/status.go: list a Job's Pods to diagnose start timeouts.
  # internal/runnerauth: resolve the Pod a Runner's token was minted for,
  # so a caller can be bound to one Operation rather than merely
  # recognized as some Runner.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
