apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Every namespaced resource lands in one namespace, and Runner Jobs run
# there too (the Role's namespace is the Runner namespace), so a first
# install needs nothing else to exist. The base holds no ConfigMap and no
# Secret: the operator creates turnip-server-config and
# turnip-server-secrets beside it. An operator renaming the namespace
# lists ../transformers/namespaces in their kustomization, and one
# separating the Runner namespace lists ../transformers/runner-namespace
# instead; see docs/operating/deployment.md.
namespace: turnip-system

resources:
  - deployment.yaml
  - service.yaml
  - serviceaccount.yaml
  - role.yaml
  - rolebinding.yaml
  # TokenReview is cluster-scoped, so validating a Runner's token cannot
  # be granted by the namespaced Role above.
  - clusterrole.yaml
  - clusterrolebinding.yaml
