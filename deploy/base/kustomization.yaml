apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Every namespaced resource lands in one namespace, and Runner Jobs run
# there too (TURNIP_RUNNER_NAMESPACE is unset), so a first install needs
# nothing else to exist. An operator renaming it lists
# ../transformers/namespaces in their kustomization, and one separating
# the Runner namespace lists ../transformers/runner-namespace instead;
# see docs/operating/deployment.md.
namespace: turnip-system

resources:
  - deployment.yaml
  - service.yaml
  - serviceaccount.yaml
  - role.yaml
  - rolebinding.yaml
  # TokenReview is cluster-scoped, so validating a Runner's token cannot
  # be granted by the namespaced Role above.
  - clusterrole.yaml
  - clusterrolebinding.yaml

# Non-secret defaults. No TURNIP_REDIS_ADDR or TURNIP_GITHUB_APP_ID here —
# there's no sane base-level default for either (Requirement 1.3: the base
# owns no Redis of its own), so every overlay must supply them via a
# configMapGenerator with `behavior: merge`.
configMapGenerator:
  - name: turnip-server-config
    literals:
      - TURNIP_LOG_LEVEL=info
      - TURNIP_HTTP_ADDR=:8080
      - TURNIP_GRPC_ADDR=:9090
      # TURNIP_RUNNER_NAMESPACE is deliberately unset: Runner Jobs run in
      # the Server's own namespace until an operator separates them.
      # No TURNIP_RUNNER_SERVER_ADDR here: the Deployment builds it from
      # its own Pod's namespace (POD_NAMESPACE).
      - TURNIP_MINIMIZE_OUTDATED_PLAN_COMMENTS=false
      # TURNIP_CLONE_SUBMODULES defaults to `top-level`, which is what the
      # base wants, so it is left unset rather than restated here. Set it
      # to `none` to stop cloning submodules at all, or `recursive` for
      # submodules of submodules.
      # TURNIP_ALLOWED_OVERRIDES is deliberately unset: its default permits
      # nothing, and the paths it accepts today are
      # `runner.serviceAccount` and `clone.submodules`. That file comes
      # from the PR's own head commit, so letting it choose a
      # ServiceAccount would let any PR author borrow that account's
      # permissions — an overlay opts in deliberately rather than the base
      # shipping it on.
      # TURNIP_ALLOWED_IMAGES is deliberately unset too: its default
      # permits only the built-in aliases (each tool's vendor image, full
      # versions or digests). Allowing an image runs code the operator
      # vouches for, with the Runner's credentials, for any PR that names
      # it, so an overlay opts in per image. See SECURITY.md.
      # TURNIP_RUNNER_IMAGE is required (orchestrator.ConfigFromEnv), so
      # the base ships a real default rather than an empty placeholder —
      # an overlay overrides it to match its own Runner image tag
      # (Decision 3).
      - TURNIP_RUNNER_IMAGE=ghcr.io/ivanvc/turnip-runner:latest
