apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: turnip-server-token-review
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: turnip-server-token-review
subjects:
  # Spelled out because a ClusterRoleBinding is cluster-scoped: there is no
  # surrounding namespace for this subject to inherit. Kustomize does not
  # rename it for a `namespace:`; the namespaces transformer sets it from
  # the ServiceAccount's namespace.
  - kind: ServiceAccount
    name: turnip-server
    namespace: turnip-system
