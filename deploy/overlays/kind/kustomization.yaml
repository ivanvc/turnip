apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Prerequisite (Requirement 1.2 — GitHub App credentials are never
# committed as plain YAML): before `kubectl apply -k deploy/overlays/kind`,
# create the Secret this overlay references by name:
#
#   kubectl create secret generic turnip-github-app \
#     --from-literal=webhook-secret=<your-webhook-secret> \
#     --from-file=private-key=<path-to-your-app-private-key.pem>
#
# This overlay assumes a Redis/Valkey Service named "redis" already exists
# in the cluster (Requirement 1.3 — the base owns no Redis of its own);
# ha-validation (Slice 11) is responsible for standing one up in its
# kind-cluster test setup.

resources:
  - ../../base

replicas:
  - name: turnip-server
    count: 1

images:
  - name: ghcr.io/ivanvc/turnip-server
    newTag: dev

configMapGenerator:
  - name: turnip-server-config
    behavior: merge
    literals:
      - TURNIP_REDIS_ADDR=redis:6379
      # Placeholder — replace with your GitHub App's real numeric ID.
      - TURNIP_GITHUB_APP_ID=0
