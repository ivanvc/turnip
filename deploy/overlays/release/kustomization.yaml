apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Rendered by .github/workflows/release.yml into a single YAML file
# attached to every GitHub Release (as turnip-install.yaml): CI
# substitutes the Server image's `:latest` tag below for the real release
# tag before rendering. This overlay is a render source, not something an
# operator is expected to run `kubectl apply -k` against directly (though
# nothing stops it: it's just the base plus a correctly tagged image).
#
# It sets only the Server image: it holds no ConfigMap and no Secret, so
# the operator creates turnip-server-config (with TURNIP_REDIS_ADDR,
# TURNIP_GITHUB_APP_ID and TURNIP_RUNNER_IMAGE) and turnip-server-secrets
# in turnip-system; see docs/operating/deployment.md's "Quick install"
# section. Most operators are better served by its primary "With
# Kustomize" section instead: a remote-base reference plus a
# configMapGenerator/secretGenerator of their own.

resources:
  - ../../base

images:
  - name: ghcr.io/ivanvc/turnip-server
    newTag: latest
