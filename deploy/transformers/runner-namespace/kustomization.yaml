apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# For an operator separating the Runner namespace from the Server's: list
# a patch of the Role's namespace, then this, under `transformers:` in
# place of ../namespaces. It includes ../namespaces, so the subjects still
# follow the Server namespace. See docs/operating/deployment.md.
resources:
  - ../namespaces
  - runner-namespace.yaml
