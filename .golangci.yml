version: "2"

run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused
    - misspell
    - testifylint
  exclusions:
    paths:
      - ".*\\.pb\\.go$"
      - ".*_grpc\\.pb\\.go$"

formatters:
  enable:
    - gofmt
  exclusions:
    paths:
      - ".*\\.pb\\.go$"
      - ".*_grpc\\.pb\\.go$"
