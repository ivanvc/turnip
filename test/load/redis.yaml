# Throwaway Redis for the ha-validation kind-cluster test setup
# (Requirement 1.5) — deployment-kustomize's base deliberately owns no
# Redis of its own (that slice's Requirement 1.3); this is exactly the
# "test setup" its kind overlay's own kustomization.yaml comment names
# this slice as responsible for providing. No persistence, no auth: this
# cluster is created and destroyed by `make test-kind` every run.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector:
    app.kubernetes.io/name: redis
  ports:
    - port: 6379
      targetPort: 6379
