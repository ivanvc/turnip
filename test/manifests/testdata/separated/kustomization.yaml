apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# An operator renaming the Server namespace and separating the Runner
# namespace, with the Role's namespace patched.
namespace: ops
resources:
  - ../../../../deploy/base
transformers:
  - runner-role-namespace.yaml
  - ../../../../deploy/transformers/runner-namespace
configMapGenerator:
  - name: turnip-server-config
    literals:
      - TURNIP_REDIS_ADDR=redis:6379
      - TURNIP_GITHUB_APP_ID=1
      - TURNIP_RUNNER_IMAGE=ghcr.io/ivanvc/turnip-runner:latest
secretGenerator:
  - name: turnip-server-secrets
    literals:
      - webhook-secret=dummy
      - private-key=dummy
