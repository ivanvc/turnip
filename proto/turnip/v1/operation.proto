syntax = "proto3";

package turnip.v1;

option go_package = "github.com/ivanvc/turnip/internal/grpc/turnip/v1";

// OperationService carries the Runner -> Server side of an Operation's
// execution. ExecuteOperation is client-streaming: the Runner is the sole
// producer of everything in this exchange (it has the cloned repo and the
// tool binary; the Server has neither), so it opens the stream, sends one
// Start, any number of Log lines, then one Result, then closes its send
// side; the Server sends a single Ack once it has durably received the
// whole stream.
service OperationService {
  rpc ExecuteOperation(stream ExecuteOperationRequest) returns (ExecuteOperationResponse);

  // FetchCloneCredential returns the GitHub credential this Operation's
  // clone should use. The Runner asks for it at the moment git needs it,
  // rather than being handed it in its Pod spec.
  rpc FetchCloneCredential(FetchCloneCredentialRequest) returns (FetchCloneCredentialResponse);
}

// FetchCloneCredentialRequest is deliberately empty.
//
// Which Operation's credential to return is decided by the caller's
// authenticated identity and by nothing else. A field naming the
// Operation would let a Runner authenticated for one Operation ask for
// another's token — and under scoped tokens that may be a different
// repository. An implementation cannot read a field that does not exist.
message FetchCloneCredentialRequest {}

message FetchCloneCredentialResponse {
  string token = 1;
  // Advisory: the helper does not enforce it and git never sees it. It
  // exists so an expired credential fails legibly rather than as an
  // unexplained 401 from GitHub.
  int64 expires_at_unix = 2;
}

message ExecuteOperationRequest {
  oneof payload {
    OperationStart start = 1;
    LogLine log = 2;
    OperationResult result = 3;
  }
}

message OperationStart {
  string operation_id = 1;
  string project_name = 2;
  string project_dir = 3;
  string tool = 4;
  string operation = 5;
  string repo_url = 6;
  string commit_sha = 7;
  // 8 was github_token. The Runner used to return to the Server a
  // credential the Server had minted and never read. Reserved rather than
  // recycled, so a future field cannot inherit the number and be silently
  // decoded as a token by a peer built before this change.
  reserved 8;
  reserved "github_token";
  map<string, string> tool_config = 9;
  repeated string extra_args = 10;
  bytes plan_data = 11;
  bool resumed = 12;
}

message LogLine {
  string timestamp = 1;
  string level = 2;
  string message = 3;
}

message OperationResult {
  bool success = 1;
  string output = 2;
  int32 exit_code = 3;
  string error_message = 4;
  ChangeSummary changes = 5;
  bytes plan_data = 6;
  // failure_category names the step that failed, so the Server can title
  // the check run without reading error_message. Unspecified on success.
  FailureCategory failure_category = 7;
}

// FailureCategory is which step of an Operation failed. Only failures that
// reach the Server are listed: a Runner that cannot report never sends a
// result, and the Server's start-deadline sweep covers it instead.
enum FailureCategory {
  FAILURE_CATEGORY_UNSPECIFIED = 0;
  // The tool ran and exited non-zero; exit_code is its exit code.
  FAILURE_CATEGORY_TOOL_EXITED = 1;
  // The repository could not be cloned into the workspace.
  FAILURE_CATEGORY_CLONE_FAILED = 2;
  // The workspace directory could not be created.
  FAILURE_CATEGORY_WORKSPACE_FAILED = 3;
  // The Plugin could not start the tool, so no exit code exists.
  FAILURE_CATEGORY_TOOL_NOT_STARTED = 4;
}

message ChangeSummary {
  int32 add = 1;
  int32 change = 2;
  int32 destroy = 3;
}

// ExecuteOperationResponse is deliberately empty: every substantive field
// already exists on the request side, since the Runner is who produces it.
// Its only job is to exist — its arrival is the signal the Runner's
// reporter is waiting for to know delivery succeeded.
message ExecuteOperationResponse {}
